name: Smart Waste Classifier CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  # ==========================================================
  # CODE QUALITY + TESTS
  # ==========================================================

  test:

    name: Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.14"
          cache: "pip"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest


      - name: Verify Python imports
        run: |
          python -c "import fastapi"
          python -c "import uvicorn"
          python -c "import tensorflow"
          python -c "from PIL import Image"


      - name: Run tests
        run: |
          pytest -v


  # ==========================================================
  # DOCKER BUILD
  # ==========================================================

  docker:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build \
            -t smart-waste-classifier:${{ github.sha }} \
            .


      - name: Verify Uvicorn
        run: |
          docker run --rm \
            smart-waste-classifier:${{ github.sha }} \
            python -c \
            "import uvicorn; print('Uvicorn:', uvicorn.__version__)"


      - name: Verify FastAPI
        run: |
          docker run --rm \
            smart-waste-classifier:${{ github.sha }} \
            python -c \
            "import fastapi; print('FastAPI:', fastapi.__version__)"


      - name: Verify TensorFlow
        run: |
          docker run --rm \
            smart-waste-classifier:${{ github.sha }} \
            python -c \
            "import tensorflow as tf; print('TensorFlow:', tf.__version__)"


      - name: Verify Pillow
        run: |
          docker run --rm \
            smart-waste-classifier:${{ github.sha }} \
            python -c \
            "from PIL import Image; print('Pillow:', Image.__version__)"


      - name: Verify API module
        run: |
          docker run --rm \
            smart-waste-classifier:${{ github.sha }} \
            python -c \
            "from src.api import app; print(app.title)"


      - name: Verify Docker image
        run: |
          docker image inspect \
            smart-waste-classifier:${{ github.sha }}