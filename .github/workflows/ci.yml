name: Smart Waste Classifier CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==================================================
      # VERIFY MODEL
      # ==================================================

      - name: Verify model
        run: |
          echo "Checking model file..."
          ls -lh models/
          test -f models/waste_classifier_finetuned.keras


      # ==================================================
      # INSTALL DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      # ==================================================
      # BASIC TESTS
      # ==================================================

      - name: Run unit tests
        run: |
          pytest -v \
            tests/test_config.py \
            tests/test_dataset.py \
            tests/test_evaluation.py \
            tests/test_model.py \
            tests/test_monitoring.py \
            tests/test_predictor.py


      # ==================================================
      # START FASTAPI
      # ==================================================

      - name: Start FastAPI server
        run: |
          nohup uvicorn src.api:app \
            --host 0.0.0.0 \
            --port 8000 \
            > api.log 2>&1 &

          echo $! > api.pid


      # ==================================================
      # WAIT FOR API
      # ==================================================

      - name: Wait for API
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:8000/health"

          for i in range(60):

              try:
                  response = requests.get(url, timeout=2)

                  if response.status_code == 200:
                      print("API is ready.")
                      break

              except requests.exceptions.RequestException:
                  pass

              print(f"Waiting for API... {i + 1}/60")
              time.sleep(2)

          else:
              print("API failed to start.")
              print("=" * 60)
              print("API LOG")
              print("=" * 60)

              try:
                  with open("api.log", "r") as f:
                      print(f.read())
              except FileNotFoundError:
                  print("api.log not found")

              raise SystemExit(1)
          PY


      # ==================================================
      # API TESTS
      # ==================================================

      - name: Run API tests
        run: |
          pytest -v \
            tests/test_api.py \
            tests/test_api_metrics.py


      # ==================================================
      # PRODUCTION TEST
      # ==================================================

      - name: Run production tests
        run: |
          pytest -v tests/test_production.py


      # ==================================================
      # SHOW API LOG ON FAILURE
      # ==================================================

      - name: Show API logs
        if: failure()
        run: |
          echo "======================================"
          echo "FASTAPI LOG"
          echo "======================================"
          cat api.log || true
